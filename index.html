<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F5C4D">
<meta name="description" content="مسكن للتسويق العقاري: شقق وفلل وشاليهات ومحلات للبيع والإيجار في مصر">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مسكن">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<title>مسكن للتسويق العقاري</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style id="appStyle">
/* Layout: app shell — sticky top bar on desktop, bottom tab bar on phones; content in a 1200px column. Nile green + brass accent. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#E8EFED; --ink:#14221F; --muted:#5A6B67; --line:#D5E0DC;
  --brand:#0F5C4D; --brand-2:#0B4A3E; --brand-ink:#FFFFFF; --brand-soft:#DCEDE7;
  --accent:#C98A22; --accent-soft:#FAEED8; --accent-ink:#5A3A05;
  --good:#1D8A57; --good-soft:#DDF3E7; --warn:#B9700E; --warn-soft:#FBEBD2; --bad:#B83A2E; --bad-soft:#F8DEDA;
  --shadow:0 1px 2px rgba(15,40,35,.06),0 6px 18px rgba(15,40,35,.07);
  --f-display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1513; --surface:#13201D; --surface-2:#1A2B27; --ink:#E5EEEB; --muted:#93A6A1; --line:#253934;
  --brand:#3DB394; --brand-2:#5CCBAD; --brand-ink:#04201A; --brand-soft:#173830;
  --accent:#E6AC4C; --accent-soft:#3A2B12; --accent-ink:#F7DDAF;
  --good:#4CC488; --good-soft:#163526; --warn:#E5A14A; --warn-soft:#3A2A12; --bad:#EE7B6E; --bad-soft:#3D1D19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1513; --surface:#13201D; --surface-2:#1A2B27; --ink:#E5EEEB; --muted:#93A6A1; --line:#253934;
  --brand:#3DB394; --brand-2:#5CCBAD; --brand-ink:#04201A; --brand-soft:#173830;
  --accent:#E6AC4C; --accent-soft:#3A2B12; --accent-ink:#F7DDAF;
  --good:#4CC488; --good-soft:#163526; --warn:#E5A14A; --warn-soft:#3A2A12; --bad:#EE7B6E; --bad-soft:#3D1D19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.3;margin:0;text-wrap:balance;font-weight:700}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}@media (max-width:760px){input,select,textarea{font-size:16px}}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{overscroll-behavior-y:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:38px;height:38px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo-mark svg{width:22px;height:22px}
.logo b{font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--brand)}
.logo span{display:block;font-size:11px;color:var(--muted);margin-top:-4px;letter-spacing:.02em}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:600;color:var(--muted);font-size:14px;display:flex;gap:6px;align-items:center}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{color:var(--brand);background:var(--brand-soft)}
.nav a .cnt{background:var(--accent);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;line-height:18px}
.bottom{display:none}
@media (max-width:860px){
  .nav{display:none}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;font-size:11px;color:var(--muted);font-weight:600;padding:4px 6px;border-radius:8px;min-width:56px}
  .bottom a svg{width:22px;height:22px}
  .bottom a.on{color:var(--brand)}
  .bottom a.add{color:var(--brand-ink);background:var(--brand);border-radius:12px}
  main{padding-bottom:84px}
}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.wa{background:#1E9E55;border-color:#1E9E55;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn svg{width:18px;height:18px;flex:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:42px}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{min-height:90px;resize:vertical}
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:500}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.check{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}

/* hero */
.hero{background:linear-gradient(160deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;position:relative;overflow:hidden}
.hero .wrap{padding-block:44px 64px;position:relative;z-index:1}
.hero-skyline{position:absolute;inset:auto 0 0 0;height:120px;opacity:.16;z-index:0}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:800;max-width:16ch}
.hero p{opacity:.85;margin:8px 0 22px;max-width:52ch}
:root[data-theme="dark"] .hero,.dark-hero{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(160deg,#12463B 0%,#0B2F28 100%)}}
:root[data-theme="dark"] .hero{background:linear-gradient(160deg,#12463B 0%,#0B2F28 100%)}
.search{background:var(--surface);color:var(--ink);border-radius:16px;padding:14px;box-shadow:var(--shadow);max-width:920px}
.search .tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{border:none;background:var(--surface-2);padding:7px 18px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--brand);color:var(--brand-ink)}
.search-row{display:grid;grid-template-columns:2fr 1.3fr 1.3fr auto;gap:10px}
@media (max-width:760px){.search-row{grid-template-columns:1fr 1fr}.search-row .btn{grid-column:1/-1}}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.quick a{color:#fff;text-decoration:none;font-size:13px;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:4px 12px}
.quick a:hover{background:rgba(255,255,255,.12)}

/* sections */
section.block{padding-block:28px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{font-size:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}

/* listing card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card .ph{position:relative;aspect-ratio:16/10;background:var(--surface-2);display:block;max-width:100%}
.card .ph img,.card .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.badges{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface);color:var(--ink)}
.badge.gold{background:var(--accent);color:#fff}
.badge.green{background:var(--good);color:#fff}
.badge.dark{background:rgba(10,25,22,.75);color:#fff}
.fav{position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;color:#B83A2E}
.fav svg{width:20px;height:20px}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.price{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--brand)}
.price small{font-size:12px;font-weight:500;color:var(--muted);font-family:var(--f-body)}
.card h3{font-size:15px;font-weight:600;font-family:var(--f-body)}
.card h3 a{text-decoration:none}
.loc{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:13px}
.loc svg{width:15px;height:15px;flex:none}
.specs{display:flex;gap:14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:auto;flex-wrap:wrap}
.specs span{display:flex;gap:4px;align-items:center}
.specs svg{width:16px;height:16px}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cmp{font-size:12px;display:flex;gap:4px;align-items:center;cursor:pointer;color:var(--muted)}

/* areas */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.area{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:2px}
.area:hover{border-color:var(--brand)}
.area b{font-family:var(--f-display);font-size:16px}

/* listings layout */
.layout{display:grid;grid-template-columns:280px 1fr;gap:22px;padding-block:22px;align-items:start}
.layout>*{min-width:0}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:84px}
.filters h3{font-size:16px}
.filters summary{list-style:none;cursor:pointer}
@media (max-width:900px){.layout{grid-template-columns:1fr}.filters{position:static}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:36px;text-align:center;color:var(--muted)}

/* map */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.mapbox svg.map{width:100%;height:auto;display:block}
.pin{cursor:pointer}
.pin rect{transition:transform .1s}
.pin:hover rect,.pin.on rect{fill:var(--accent)}
.map-pop{position:absolute;bottom:12px;right:12px;width:300px;max-width:calc(100% - 24px)}
.map-legend{display:flex;gap:14px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}

/* detail */
.detail{display:grid;grid-template-columns:1fr 360px;gap:24px;padding-block:22px;align-items:start}
.detail>*{min-width:0}
@media (max-width:960px){.detail{grid-template-columns:1fr}}
.gallery .main{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--surface-2);max-width:100%}
.gallery .main img,.gallery .main svg{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.thumbs button{width:92px;aspect-ratio:16/10;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;flex:none;background:var(--surface-2)}
.thumbs button.on{border-color:var(--brand)}
.thumbs img,.thumbs svg{width:100%;height:100%;object-fit:cover;display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel+.panel{margin-top:16px}
.panel h3{font-size:17px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kv>div>span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-size:15px}
.feat{display:flex;flex-wrap:wrap;gap:8px}
.feat span{background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.sticky-side{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
.private{border:1px dashed var(--accent);background:var(--accent-soft)}
.private h3{color:var(--accent-ink)}
.broker{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;flex:none}
.phone-line{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:10px;padding:8px 12px;margin-top:10px}
.calc-out{background:var(--brand-soft);border-radius:10px;padding:12px;margin-top:12px;display:grid;gap:4px}
.calc-out b{color:var(--brand);font-family:var(--f-display);font-size:20px}

/* dashboard */
.dash-tabs{display:flex;gap:6px;overflow-x:auto;padding-block:16px 4px}
.dash-tabs a{padding:8px 16px;border-radius:10px;text-decoration:none;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.dash-tabs a.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi>span{color:var(--muted);font-size:13px;font-weight:600}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;margin-top:4px}
.kpi em{font-style:normal;font-size:12px;color:var(--good);font-weight:600}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px}
.two>*{min-width:0}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.list .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .row:last-child{border-bottom:none}
.list .row>div{min-width:0;flex:1}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-new{background:var(--brand-soft);color:var(--brand)}
.p-contacted{background:var(--surface-2);color:var(--ink)}
.p-viewing{background:var(--accent-soft);color:var(--accent-ink)}
.p-negotiation{background:var(--warn-soft);color:var(--warn)}
.p-won{background:var(--good-soft);color:var(--good)}
.p-lost{background:var(--bad-soft);color:var(--bad)}
.p-late{background:var(--bad-soft);color:var(--bad)}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.col h4{font-size:14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-body);font-weight:700}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.lead b{font-size:14px}
.lead .acts{display:flex;gap:4px;flex-wrap:wrap}
.match{color:var(--brand);font-weight:700;text-decoration:none}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:none}
.bars{display:flex;align-items:end;gap:10px;height:170px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:end;min-width:0}
.bars .stack{width:100%;max-width:44px;display:flex;flex-direction:column;justify-content:end;border-radius:6px 6px 0 0;overflow:hidden}
.bars .rec{background:var(--brand)}
.bars .exp{background:var(--accent)}
.bars small{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}
.funnel .f{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center;margin-bottom:8px;font-size:13px}
.funnel .track{background:var(--surface-2);border-radius:6px;height:12px;overflow:hidden}
.funnel .fill{height:100%;background:var(--brand);border-radius:6px}
.drawer{background:var(--surface);border:1px solid var(--brand);border-radius:14px;padding:16px;margin-bottom:16px}

/* compare */
.cmp-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:45;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 8px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.cmp-bar span{padding-inline-start:8px}
@media (max-width:860px){.cmp-bar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

.toast{position:fixed;top:calc(76px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:99;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.footer{border-top:1px solid var(--line);margin-top:30px;padding-block:22px;color:var(--muted);font-size:13px}
.footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
/* side menu */

let BROKER_MODE = DEMO, db = null, ASSETS = null, ART = null;
function dbErr(e){ toast(e&&e.code==="permission_denied"?"مش مسموح لك تعدل هنا":"حصلت مشكلة في الحفظ، جرب تاني"); }
const CRM = {
  async put(coll,id,obj){ obj={...obj}; delete obj.id;
    if(db){ try{ await db.doc(`crm/main/${coll}/${id}`).set(obj); }catch(e){ dbErr(e); } return; }
    if(coll==="owners") S.owners[id]=obj; else { const i=S[coll].findIndex(x=>x.id===id); const o={id,...obj}; i>=0?S[coll][i]=o:S[coll].unshift(o); }
    save(); render(true); if(SUPA) await sbUpsert(coll,id,obj); },
  async patch(coll,id,p){
    if(db){ try{ await db.doc(`crm/main/${coll}/${id}`).update(p); }catch(e){ dbErr(e); } return; }
    const o=coll==="owners"?S.owners[id]:S[coll].find(x=>x.id===id); if(o) Object.assign(o,p); save(); render(true);
    if(SUPA&&o){ const {id:_,...data}=o; await sbUpsert(coll,id,data); } },
  async del(coll,id){
    if(db){ try{ await db.doc(`crm/main/${coll}/${id}`).delete(); }catch(e){ dbErr(e); } return; }
    if(coll==="owners") delete S.owners[id]; else S[coll]=S[coll].filter(x=>x.id!==id); save(); render(true);
    if(SUPA){ const {error}=await sb.from("maskan_"+coll).delete().eq("id",id); if(error) dbErr(error); } }
};
async function sbUpsert(coll,id,data){ const {error}=await sb.from("maskan_"+coll).upsert({id,data}); if(error){ console.warn(error); dbErr(error); } }
let sbListingIds=new Set();
async function sbLoadPublic(){
  const [st,ls]=await Promise.all([sb.from("maskan_settings").select("data").eq("id",1).maybeSingle(), sb.from("maskan_listings").select("id,data")]);
  if(st.data&&st.data.data){ const t=st.data.data; APP={name:t.appName||APP.name,tagline:t.tagline||""}; BROKER={name:t.brokerName||"",phone:t.phone||"",office:t.office||""}; EXTRA={bio:t.bio||"",reviews:Array.isArray(t.reviews)?t.reviews:[]}; }
  if(ls.data){ S.listings=ls.data.map(r=>({...r.data,id:r.id})).sort((a,b)=>String(b.date).localeCompare(String(a.date))); sbListingIds=new Set(ls.data.map(r=>r.id)); }
  document.title=APP.name+" "+APP.tagline;
}
async function sbLoadPrivate(){
  const [a,b,c]=await Promise.all(["leads","deals","owners"].map(t=>sb.from("maskan_"+t).select("id,data")));
  S.leads=(a.data||[]).map(r=>({id:r.id,...r.data})).sort((x,y)=>String(y.created||"").localeCompare(String(x.created||"")));
  S.deals=(b.data||[]).map(r=>({id:r.id,...r.data}));
  const o={}; (c.data||[]).forEach(r=>o[r.id]=r.data); S.owners=o;
}
async function sbSeedIfEmpty(){
  if(S.listings.length||S.leads.length) return;
  const s=seed();
  await sb.from("maskan_listings").upsert(s.listings.map(l=>({id:l.id,data:stripPriv(l)})));
  const ow=ownersOf(s.listings); await sb.from("maskan_owners").upsert(Object.keys(ow).map(k=>({id:k,data:ow[k]})));
  await sb.from("maskan_leads").upsert(s.leads.map(({id,...d})=>({id,data:d})));
  await sb.from("maskan_deals").upsert(s.deals.map(({id,...d})=>({id,data:d})));
  await sbLoadPublic(); await sbLoadPrivate();
}
async function sbAfterLogin(){
  const {data,error}=await sb.rpc("maskan_claim");
  if(error||!data){ BROKER_MODE=false; toast("الحساب ده مش حساب السمسار"); render(true); return; }
  BROKER_MODE=true; await sbLoadPrivate(); await sbSeedIfEmpty(); render(true);
}
async function sbLogin(email,pass,isNew){
  const r=isNew? await sb.auth.signUp({email,password:pass}) : await sb.auth.signInWithPassword({email,password:pass});
  if(r.error){ toast(/Invalid login/i.test(r.error.message)?"الإيميل أو الباسورد غلط":/registered/i.test(r.error.message)?"الإيميل ده عنده حساب، اعمل دخول":/Password/i.test(r.error.message)?"الباسورد لازم 6 حروف على الأقل":"حصلت مشكلة: "+r.error.message); return false; }
  if(!r.data.session){ toast("ابعتنالك رسالة تأكيد على الإيميل، افتحها وبعدين اعمل دخول"); return false; }
  await sbAfterLogin(); if(BROKER_MODE){ toast("أهلاً يا "+BROKER.name+" ✓"); nav("dashboard"); } return true;
}
async function sbLogout(){ await sb.auth.signOut(); BROKER_MODE=false; S.leads=[];S.deals=[];S.owners={}; nav("home"); render(true); toast("اتعمل خروج"); }
const RESET_CSS = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";

    +'<script type="application/json" id="siteData">'+data+'<\/script>\n<script id="main">'+document.getElementById("main").textContent+'<\/script></body></html>';

async function publishSite(msg, goHash){
  if(DEMO){ save(); toast(msg||"اتحفظ ✓"); if(goHash&&location.hash!=="#"+goHash) nav(goHash); else render(true); return true; }
  if(SUPA){ toast("بيتحفظ…");
    const settings={appName:APP.name,tagline:APP.tagline,brokerName:BROKER.name,phone:BROKER.phone,office:BROKER.office,bio:EXTRA.bio,reviews:EXTRA.reviews};
    const r1=await sb.from("maskan_settings").upsert({id:1,data:settings});
    const r2=S.listings.length? await sb.from("maskan_listings").upsert(S.listings.map(l=>({id:l.id,data:l}))) : {error:null};
    const gone=[...sbListingIds].filter(id=>!S.listings.some(l=>l.id===id));
    const r3=gone.length? await sb.from("maskan_listings").delete().in("id",gone) : {error:null};
    if(r1.error||r2.error||r3.error){ dbErr(r1.error||r2.error||r3.error); return false; }
    sbListingIds=new Set(S.listings.map(l=>l.id)); document.title=APP.name+" "+APP.tagline;
    toast(msg||"اتحفظ ✓"); if(goHash&&location.hash!=="#"+goHash) nav(goHash); else render(true); return true; }
  if(!ART){ toast("الحفظ مش متاح من هنا، افتح البرنامج من حسابك"); return false; }
  try{ sessionStorage.setItem("maskan_after", JSON.stringify({msg:msg||"اتحفظ ✓", go:goHash||location.hash.slice(1)})); }catch(e){}
  toast("بيتحفظ…");
  try{ await ART.publish(buildPage()); return true; }
  catch(e){ const c=e&&e.code;
    if(c==="conflict") return false;
    toast(c==="not_writer"||c==="not_granted"?"مش مسموح لك تعدل البرنامج":c==="too_large"?"الصفحة كبرت أوي، قلل الصور":c==="rate_limited"?"استنى ثواني وجرب تاني":"مقدرتش أحفظ، جرب تاني"); return false; }
}
let pendingRender=false;
function softRender(){ const a=document.activeElement; if(a&&a.closest&&a.closest("#app form")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){ pendingRender=true; return; } render(true); }
document.addEventListener("focusout",()=>setTimeout(()=>{ if(!pendingRender) return; const a=document.activeElement; if(!(a&&a.closest&&a.closest("#app form"))){ pendingRender=false; render(true); } },60));
async function boot(){
  try{ const a=JSON.parse(sessionStorage.getItem("maskan_after")||"null"); if(a){ sessionStorage.removeItem("maskan_after"); if(a.go&&location.hash!=="#"+a.go) nav(a.go); setTimeout(()=>toast(a.msg),300); } }catch(e){}
  if(DEMO) return;
  if(SUPA){ try{ await sbLoadPublic(); render(true); const {data}=await sb.auth.getSession(); if(data&&data.session) await sbAfterLogin(); }catch(e){ console.warn(e); toast("مش قادر أوصل للسيرفر، اتأكد من النت"); } return; }
  try{
    const [user,art]=await Promise.all([claude.use("user"),claude.use("artifact")]);
    ART=art;
    const can = user ? await user.canEdit() : false;
    if(!can) return;
    BROKER_MODE=true;
    [db,ASSETS]=await Promise.all([claude.use("db"),claude.use("assets")]);
    render(true);
    if(!db){ toast("قاعدة البيانات مش متاحة دلوقتي"); return; }
    const C=n=>db.collection("crm/main/"+n);
    const err=e=>console.warn("db",e&&e.code);
    C("leads").onSnapshot(q=>{ S.leads=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.created||"").localeCompare(String(a.created||""))); softRender(); },err);
    C("deals").onSnapshot(q=>{ S.deals=q.docs.map(d=>({id:d.id,...d.data()})); softRender(); },err);
    C("owners").onSnapshot(q=>{ const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.owners=o; softRender(); },err);
  }catch(e){ console.warn(e); }
}
const byId = id => S.listings.find(l=>l.id===id);
const commOf = d => d.price*d.pct/100*(1-(d.split||0)/100);
function quality(l){
  const miss=[]; let sc=0; const add=(ok,pts,msg)=>{ if(ok) sc+=pts; else miss.push(msg); };
  const realImgs=(l.images||[]).length;
  add(realImgs>=3,25,realImgs?"ضيف صور أكتر (3 على الأقل)":"ضيف صور حقيقية");
  add((l.desc||"").length>=80,15,"اكتب وصف أطول");
  add((l.title||"").length>=20,10,"خلي العنوان أوضح وأطول");
  add((l.features||[]).length>=3,15,"اختار 3 مميزات على الأقل");
  add(l.price>0&&l.size>0,10,"اكتب السعر والمساحة");
  add(l.verified,10,"راجع الأوراق وعلّمه موثّق");
  add(!!(l.compound||(l.floor&&l.floor!=="—")),5,"اكتب الدور أو الكمبوند");
  add(["أرض","محل تجاري","مكتب إداري"].includes(l.type)||(l.beds>0&&l.baths>0),10,"اكتب عدد الغرف والحمامات");
  return {score:sc,miss,level:sc>=75?"good":sc>=50?"mid":"bad"};
}
const qPill = q => `<span class="pill ${q.level==="good"?"p-won":q.level==="mid"?"p-viewing":"p-lost"}" title="${esc(q.miss.join("، "))}">${q.score}%</span>`;
const code = l => String(l.id).toUpperCase().slice(-6);
function hot(c){ if(["won","lost"].includes(c.stage)) return false; if(["viewing","negotiation"].includes(c.stage)) return true; return !!(c.listingId && c.created && daysAgo(c.created)<=2 && c.next && c.next<=addDays(1)); }
function tpls(c){
  const m=matches(c).slice(0,3), n=c.need||{}, l=c.listingId&&byId(c.listingId);
  return [
    ["ترحيب",`أهلاً يا ${c.name} 👋 معاك ${BROKER.name} من ${APP.name}. وصلني طلبك ${n.purpose==="rent"?"لإيجار":"لشراء"} ${n.type||"عقار"}${n.area?" في "+n.area:""}، وهبعتلك أنسب العروض حالاً.`],

const F0 = {purpose:"",type:"",area:"",minP:"",maxP:"",beds:"",finishing:"",payment:"",delivery:"",q:"",sort:"new",verified:false,feats:[]};
let F = {...F0};
let listMode="grid";
function applyFilters(arr=S.listings){
  let r=arr.filter(l=>l.status!=="sold");
  if(F.purpose) r=r.filter(l=>l.purpose===F.purpose);
  if(F.type) r=r.filter(l=>l.type===F.type);
  if(F.area) r=r.filter(l=>l.area===F.area);
  if(F.minP) r=r.filter(l=>l.price>=+F.minP);
  if(F.maxP) r=r.filter(l=>l.price<=+F.maxP);
  if(F.beds) r=r.filter(l=>l.beds>=+F.beds);
  if(F.finishing) r=r.filter(l=>l.finishing===F.finishing);
  if(F.payment) r=r.filter(l=>l.payment===F.payment);
  if(F.verified) r=r.filter(l=>l.verified);
  if(F.feats&&F.feats.length) r=r.filter(l=>F.feats.every(f=>(l.features||[]).includes(f)));
  if(F.delivery) r=r.filter(l=>(l.delivery||"ready")===F.delivery);
  if(F.q){ const q=F.q.trim(); r=r.filter(l=>(l.title+l.area+l.compound+l.type+l.desc).includes(q)); }
  const s={new:(a,b)=>b.date.localeCompare(a.date),low:(a,b)=>a.price-b.price,high:(a,b)=>b.price-a.price,ppm:(a,b)=>a.price/a.size-b.price/b.size}[F.sort]||((a,b)=>b.date.localeCompare(a.date));
  return r.sort((a,b)=>(b.featured-a.featured)||s(a,b));
}
function matches(lead){
  const n=lead.need||{};
  return S.listings.filter(l=>l.status==="active" && l.purpose===n.purpose && (!n.type||l.type===n.type) && (!n.area||l.area===n.area) && (!n.max||l.price<=n.max*1.1) && (!n.beds||l.beds>=n.beds));
}

let mapSel=null;
function mapSvg(list){
  const onMap=list.filter(l=>AREAS[l.area]&&AREAS[l.area].x!=null);
  const off=list.filter(l=>!(AREAS[l.area]&&AREAS[l.area].x!=null));
  const pins=onMap.map((l,i)=>{const a=AREAS[l.area];const n=[...l.id].reduce((s,c)=>s+c.charCodeAt(0),0);const x=a.x+((n*37)%60-30),y=a.y+((n*53)%40-20);
    const label=l.purpose==="rent"?fmt(l.price/1000)+"K":(l.price/1e6).toFixed(1).replace(/\.0$/,"")+"M";const w=label.length*8+14;
    return `<g class="pin ${mapSel===l.id?"on":""}" data-act="pin" data-id="${l.id}" transform="translate(${x},${y})" tabindex="0" role="button" aria-label="${esc(l.title)}"><rect x="${-w/2}" y="-26" width="${w}" height="22" rx="11" fill="var(--brand)"/><path d="M-5 -5 0 3 5 -5z" fill="var(--brand)"/><text y="-11" text-anchor="middle" font-size="12" font-weight="700" fill="var(--brand-ink)" font-family="sans-serif">${label}</text></g>`}).join("");
  const sel=mapSel&&byId(mapSel);
  return `<div class="mapbox">
    <svg class="map" viewBox="0 0 1000 600" role="img" aria-label="خريطة القاهرة الكبرى">
      <rect width="1000" height="600" fill="var(--surface-2)"/>
      <path d="M0 0h1000v600H0z" fill="none"/>
      <path d="M455 0C470 120 440 200 470 300S500 450 510 600" stroke="#5DA9C9" stroke-width="18" fill="none" opacity=".6"/>
      <path d="M455 0C470 120 440 200 470 300S500 450 510 600" stroke="#5DA9C9" stroke-width="4" fill="none"/>
      <g stroke="var(--line)" stroke-width="3" fill="none"><path d="M100 380 Q300 360 470 300 T720 330 960 480"/><path d="M160 250 Q330 270 470 290"/><path d="M560 120 Q650 200 700 330 T860 520"/><path d="M600 200 Q750 240 850 235"/></g>
      <g font-family="sans-serif" font-size="14" fill="var(--muted)" text-anchor="middle" font-weight="600">${Object.entries(AREAS).filter(([,a])=>a.x!=null).map(([n,a])=>`<text x="${a.x}" y="${a.y+34}">${n}</text>`).join("")}</g>
      <text x="485" y="40" font-family="sans-serif" font-size="13" fill="#3B8FB0" font-weight="700">النيل</text>
      ${pins}
    </svg>
    ${sel?`<div class="map-pop">${card(sel)}</div>`:""}
    <div class="map-legend"><span>دوس على أي سعر عشان تشوف العقار</span>${off.length?`<span>· خارج القاهرة: ${off.map(l=>`<a href="#p-${l.id}">${esc(l.area)} (${money(l.price)})</a>`).join("، ")}</span>`:""}</div>
  </div>`;
}

function dashTabs(cur){

  return `<div class="dash-tabs">${t.map(([k,v])=>`<a href="#${k}" class="${cur===k?"on":""}">${v}</a>`).join("")}</div>`;
}

    </div>
    ${demoBanner()}

function shrink(file){ return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;const x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);const fs=Math.max(16,Math.round(c.width/22));x.font=`700 ${fs}px Alexandria, Tahoma, sans-serif`;x.textAlign="left";x.textBaseline="bottom";x.fillStyle="rgba(0,0,0,.35)";x.fillText(APP.name+" "+APP.tagline,fs*0.6+2,c.height-fs*0.5+2);x.fillStyle="rgba(255,255,255,.85)";x.fillText(APP.name+" "+APP.tagline,fs*0.6,c.height-fs*0.5);res(c.toDataURL("image/jpeg",0.72));};im.onerror=()=>res(r.result);im.src=r.result;};r.readAsDataURL(file);}); }

  switch(a){
    case "logout": sbLogout(); break;
    case "install": doInstall(); break;
    case "toggleFeat": { const v=el.dataset.v; F.feats=(F.feats||[]).includes(v)?F.feats.filter(x=>x!==v):[...(F.feats||[]),v]; render(true); break; }
    case "clone": { const l=byId(id); const nid=uid(); S.listings.unshift({...JSON.parse(JSON.stringify(l)),id:nid,title:l.title+" (نسخة)",date:today(),status:"active",demo:false}); const o=priv(id); CRM.put("owners",nid,{owner:o.owner||"",ownerPhone:o.ownerPhone||"",commission:o.commission||0}); publishSite("اتعملت نسخة، عدّل اللي محتاجه","edit-"+nid); break; }
    case "renew": { const l=byId(id); l.date=today(); publishSite("الإعلان اتجدد ✓"); break; }
    case "touch": CRM.patch("leads",id,{lastContact:today()}); break;
    case "follow": CRM.patch("leads",id,{next:addDays(+el.dataset.d),lastContact:today()}); toast("اتحدد ميعاد المتابعة ✓"); break;
    case "valuation": { const l=byId(id), v=valuation(l); if(!v){ toast("مفيش عقارات شبهه كفاية للمقارنة"); break; }
      copy(`تقييم سعر ${l.title}\nالمنطقة: ${l.area} · المساحة ${l.size} م²\nبناءً على ${v.n} عقار شبهه في نفس المنطقة:\nمتوسط سعر المتر: ${fmt(v.mid)} ج.م\nالسعر المناسب: من ${fmt(v.low)} لحد ${fmt(v.high)} ج.م\nالسعر المعروض حالياً: ${fmt(l.price)} ج.م ${l.price>v.high?"(أعلى من السوق)":l.price<v.low?"(أقل من السوق)":"(مناسب للسوق)"}\n— ${BROKER.name}، ${APP.name}`); break; }
    case "fav": S.favs.includes(id)?S.favs=S.favs.filter(x=>x!==id):S.favs.push(id); save(); toast(S.favs.includes(id)?"اتحفظ في المفضلة ♥":"اتشال من المفضلة"); render(true); break;
    case "setF": F[el.dataset.k]=el.dataset.v; render(true); break;
    case "clearF": F={...F0,feats:[]}; render(true); break;
    case "goArea": F={...F,area:el.dataset.area,q:"",type:""}; break;
    case "goInst": F={...F,payment:"installment",purpose:"sale"}; break;
    case "matchGo": { const c=S.leads.find(x=>x.id===id),n=c.need; F={...F0,feats:[],purpose:n.purpose,type:n.type||"",area:n.area||"",maxP:n.max?Math.round(n.max*1.1):"",beds:n.beds?String(n.beds):"",sort:"low"}; listMode="grid"; break; }
    case "mode": listMode=el.dataset.v; render(true); break;
    case "pin": mapSel=id; render(true); break;
    case "gal": galIdx=+el.dataset.i; render(true); break;
    case "copy": copy(el.dataset.v); break;
    case "share": { const l=byId(id); copy(`${l.title}\n${l.area} · ${fmt(l.price)} ج.م\nكود الإعلان: ${String(l.id).toUpperCase().slice(-6)}\nللتواصل: ${BROKER.name} ${BROKER.phone}`); break; }
    case "stage": { const c=S.leads.find(x=>x.id===id); const i=STAGES.findIndex(s=>s.k===c.stage)+(+el.dataset.d); const ns=STAGES[Math.max(0,Math.min(STAGES.length-1,i))].k; toast("اتنقل لـ "+STAGES.find(s=>s.k===ns).t); CRM.patch("leads",id,{stage:ns}); if(ns==="won"){showDealForm=true;nav("dash-deals");} break; }
    case "stageTo": CRM.patch("leads",id,{stage:el.dataset.s}); break;
    case "toggleLead": showLeadForm=!showLeadForm; render(true); break;
    case "toggleDeal": showDealForm=!showDealForm; render(true); break;
    case "dealRec": CRM.patch("deals",id,{status:"received",date:today()}); toast("مبروك! العمولة اتقبضت 💰"); break;
    case "dealDel": CRM.del("deals",id); break;
    case "feature": { const l=byId(id); l.featured=!l.featured; publishSite(l.featured?"بقى مميز ⭐":"اتشال من المميز"); break; }
    case "delListing": if(delArm!==id){ delArm=id; render(true); setTimeout(()=>{ if(delArm===id){ delArm=null; render(true);} },4000); break; }
      delArm=null; S.listings=S.listings.filter(l=>l.id!==id); CRM.del("owners",id); publishSite("الإعلان اتمسح"); break;
    case "clearDemo": if(!clearArm){ clearArm=true; render(true); setTimeout(()=>{ clearArm=false; render(true); },4000); break; }
      clearArm=false; (async()=>{ const ls=S.leads.filter(c=>c.demo), ds=S.deals.filter(d=>d.demo), os=Object.keys(S.owners).filter(k=>S.owners[k]&&S.owners[k].demo);
        for(const c of ls) await CRM.del("leads",c.id); for(const d of ds) await CRM.del("deals",d.id); for(const k of os) await CRM.del("owners",k);
        const had=S.listings.some(l=>l.demo); S.listings=S.listings.filter(l=>!l.demo); if(had) publishSite("الأمثلة اتمسحت، البرنامج جاهز لشغلك ✓"); else { render(true); toast("الأمثلة اتمسحت ✓"); } })(); break;
    case "shareText": { const l=byId(id); copy(`🏠 ${l.title}\n📍 ${l.area}${l.compound?" - "+l.compound:""}\n📐 ${l.size} م²${l.beds?` | ${l.beds} غرف`:""}${l.baths?` | ${l.baths} حمام`:""}\n✨ ${l.finishing}${l.payment==="installment"?` | مقدم ${l.down}% وتقسيط ${l.years} سنين`:" | كاش"}\n💰 ${fmt(l.price)} ج.م${l.purpose==="rent"?" شهرياً":""}\n\n${l.desc}\n\n📞 ${BROKER.name}: ${BROKER.phone}\nكود الإعلان: ${String(l.id).toUpperCase().slice(-6)}`); break; }
    case "cmpClear": S.compare=[]; save(); render(true); break;
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.act==="cmp"){ const id=el.dataset.id;
    if(el.checked){ if(S.compare.length>=3){el.checked=false;toast("أقصى حاجة 3 عقارات");return;} S.compare.push(id);} else S.compare=S.compare.filter(x=>x!==id);
    save(); cmpBar(); }
  if(el.dataset.act==="dealStage"){ const st=el.value; CRM.patch("deals",el.dataset.id,st==="اتقفلت"?{stage:st,status:"received",date:today()}:{stage:st}); toast("اتحدثت المرحلة ✓"); }
  if(el.id==="repM"){ repMonth=el.value; render(true); }
  if(el.dataset.act==="statusSel"){ const l=byId(el.dataset.id); l.status=el.value; publishSite("اتحدثت الحالة ✓"); }
});
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.classList?.contains("pin")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); }});

/* ========= تشغيل ========= */
document.title = APP.name + " " + APP.tagline;
$("#brandName").textContent=APP.name; $("#brandSub").textContent=APP.tagline;
lastHash=location.hash;
const closeSide=()=>{ $("#side").classList.remove("open"); $("#scrim").hidden=true; };
$("#menuBtn").onclick=()=>{ $("#side").classList.add("open"); $("#scrim").hidden=false; try{ history.pushState({...(history.state||{}),side:1},"",location.href); }catch(e){} };
$("#scrim").onclick=()=>{ if(history.state&&history.state.side) history.back(); else closeSide(); };
window.addEventListener("hashchange",closeSide);
/* زرار الرجوع زي كسارة: الشاشات الرئيسية مش بتتراكم، من أي شاشة الرجوع بيوديك للرئيسية، ومن الرئيسية بيخرج */
let navPending=null;
window.addEventListener("popstate",()=>{
  if($("#side").classList.contains("open")) closeSide();
  if(navPending!==null){ const t=navPending; navPending=null; setTimeout(()=>nav(t),0); }
});
document.addEventListener("click",e=>{
  if(e.defaultPrevented||e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey) return;
  const a=e.target.closest&&e.target.closest('a[href^="#"]'); if(!a||a.target) return;
  e.preventDefault(); nav(a.getAttribute("href"));
});
render(false);
boot();
</script>
